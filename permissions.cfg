# ==============================================================================
#  Wraith Core — ACE Permissions Configuration
# ==============================================================================

# Allow w_core to execute framework commands
add_ace resource.w_core command allow

# Allow w_lib to manage ACE permissions & principals for restricted commands and ranks
add_ace resource.w_lib command.add_ace allow
add_ace resource.w_lib command.remove_ace allow
add_ace resource.w_lib command.add_principal allow
add_ace resource.w_lib command.remove_principal allow

# Script admin permissions for group.admin
add_ace group.admin w_adminmenu.open allow
add_ace group.admin w_hud.admin allow
add_ace group.admin w_clothing.admin allow
add_ace group.admin w_barber.admin allow

# Standard ACE groups
add_ace group.god god allow
add_ace group.admin admin allow
add_ace group.mod mod allow

# Allow commands for admins, but explicitly deny dangerous server-control commands
# so staff cannot escalate privileges or stop/exec server configs from in-game chat.
add_ace group.admin command allow
add_ace group.admin command.add_ace deny
add_ace group.admin command.remove_ace deny
add_ace group.admin command.add_principal deny
add_ace group.admin command.remove_principal deny
add_ace group.admin command.exec deny
add_ace group.admin command.set deny
add_ace group.admin command.sets deny
add_ace group.admin command.setr deny
add_ace group.admin command.seta deny
add_ace group.admin command.ensure deny
add_ace group.admin command.start deny
add_ace group.admin command.stop deny
add_ace group.admin command.restart deny
add_ace group.admin command.refresh deny
add_ace group.admin command.quit deny
add_ace group.admin command.rcon_password deny
add_ace group.admin command.sv_licenseKey deny
add_ace group.admin command.steam_webApiKey deny

# Group inheritance hierarchy: god -> admin -> mod
add_principal group.god group.admin
add_principal group.admin group.mod

# Example manual admin grant (or use w_ranks:masters in server.cfg):
# add_principal identifier.license:YOUR_LICENSE_HERE group.god
