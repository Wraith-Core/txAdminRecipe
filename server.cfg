# ==============================================================================
#  Wraith Core — Official RedM Server Configuration
#  Docs: https://wraith-core.github.io/docs/
# ==============================================================================

{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# License key & database connection (managed by txAdmin)
sv_licenseKey "{{svLicense}}"
set mysql_connection_string "{{dbConnectionString}}"

# Server identity (configure server list name, tags, description & banners at https://portal.cfx.re/)
sv_hostname "{{serverName}} built with {{recipeName}} by {{recipeAuthor}}!"
set gamename rdr3
set sv_enforceGameBuild 1491

# OneSync
set onesync on

# ==============================================================================
#  Wraith Core Settings
# ==============================================================================

# Framework language: "en" (English) or "ar" (Arabic).
# Every Wraith Core resource follows this convar by default.
setr w_lib:locale "en"

# Loading screen branding (optional overrides)
setr w_loading:serverName "{{serverName}}"
setr w_loading:brandLatin "WRAITH CORE"
setr w_loading:brandArabic "WRAITH CORE"

# Enable built-in General Stores inside w_inventory (Valentine, Rhodes, Saint Denis, etc.)
setr w_inventory:defaultShops 1

# Master staff ranks (comma-separated identifiers, e.g. "license:xxxx,steam:xxxx")
# Owners listed here receive full master permissions on every boot.
set w_ranks:masters ""

# Mute state-bag strict mode advisory (display-only client bags are used for UI gates)
set w_lib:ignoreSecurityAdvisory ["stateBagStrictMode"]

# ==============================================================================
#  Permissions & Voice
# ==============================================================================
exec permissions.cfg
exec voice.cfg

# txAdmin master admin principal
{{addPrincipalsMaster}}

# ==============================================================================
#  Resources (Ensure Order Matters)
# ==============================================================================

# Cfx.re base resources
ensure mapmanager
ensure spawnmanager
ensure basic-gamemode

# Standalone dependencies
ensure oxmysql
ensure pma-voice

# Wraith Core — Core Stack
ensure w_lib
ensure w_core
ensure w_inventory
ensure w_chat
ensure w_loading
ensure w_adminmenu

# Character, Appearance & HUD
ensure w_creators
ensure w_clothing
ensure w_barber
ensure w_hud
ensure w_zones

# World, Environment & Security
ensure w_weathersync
ensure w_interiors
ensure w_doorlock

# Economy & Core Roleplay Jobs
ensure w_banking
ensure w_management
ensure w_policejob
ensure w_medic
